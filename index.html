<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 잠언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf8f3; --fg:#2b2723; --muted:#8a8279; --accent:#6b4f2a; --line:#e6e0d4; --hl:#f3e6c4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1b19; --fg:#e8e3da; --muted:#9a9288; --accent:#d1a964; --line:#38342f; --hl:#3d3320; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif; line-height:1.95;
    -webkit-text-size-adjust:100%; }
  main { max-width:640px; margin:0 auto; padding:28px 20px 140px; }
  header { text-align:center; margin-bottom:18px; }
  .date { color:var(--muted); font-size:.9rem; font-family:system-ui,sans-serif; }
  h1 { margin:.2em 0 0; font-size:1.8rem; color:var(--accent); }

  .player { position:sticky; top:0; background:var(--bg); padding:12px 0 10px;
    border-bottom:1px solid var(--line); margin-bottom:22px; z-index:2;
    font-family:system-ui,sans-serif; }
  .row { display:flex; align-items:center; gap:10px; }
  .row button { border:1px solid var(--line); background:transparent; color:var(--fg);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:.8rem; flex:none; }
  .row #play { width:46px; height:46px; background:var(--accent); color:var(--bg);
    border-color:var(--accent); font-size:1rem; }
  #seek { flex:1; min-width:0; accent-color:var(--accent); }
  #time { color:var(--muted); font-size:.78rem; min-width:80px; text-align:right; font-variant-numeric:tabular-nums; }
  .speed { display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .speed button { border:1px solid var(--line); background:transparent; color:var(--fg);
    padding:4px 11px; border-radius:999px; cursor:pointer; font-size:.82rem; }
  .speed button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .note { color:var(--muted); font-size:.85rem; text-align:center; margin:8px 0 0; }

  .verse { margin:0 0 .35em; padding:.3em .6em; font-size:1.1rem; border-radius:8px;
    cursor:pointer; transition:background .25s; }
  .verse sup { color:var(--accent); font-size:.7rem; margin-right:6px; font-family:system-ui,sans-serif; }
  .verse.on { background:var(--hl); }

  .game { margin-top:40px; font-family:system-ui,sans-serif; }
  .game .lock { text-align:center; color:var(--muted); font-size:.88rem; margin:0; }
  .game h2 { margin:0 0 4px; text-align:center; color:var(--accent); font-family:inherit; font-size:1.2rem; }
  .game .sub { text-align:center; color:var(--muted); font-size:.86rem; margin:0 0 14px; line-height:1.6; }
  .game canvas { display:block; width:100%; max-width:420px; margin:0 auto; aspect-ratio:360/520;
    border-radius:16px; border:1px solid var(--line); touch-action:manipulation; cursor:pointer;
    -webkit-tap-highlight-color:transparent; outline:none; background:#cfe6f7; }
  .game .gobox { text-align:center; margin-top:14px; }
  .game .gotitle { font-size:1.05rem; color:var(--accent); font-weight:700; }
  .game .godesc { color:var(--muted); font-size:.86rem; margin:6px 0 0; line-height:1.6; }
  .game .go { display:inline-block; margin-top:12px; padding:11px 24px; border-radius:999px; border:0;
    background:var(--accent); color:var(--bg); font-size:.95rem; cursor:pointer; }

  .chnav { display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
    font-family:system-ui,sans-serif; }
  .chnav a { display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border-radius:999px;
    border:1px solid var(--line); color:var(--fg); text-decoration:none; font-size:.95rem; cursor:pointer;
    -webkit-tap-highlight-color:transparent; }
  .chnav a:active { background:var(--hl); }
  .chnav a.off { visibility:hidden; }
  .chnav #chToday { background:var(--accent); color:var(--bg); border-color:var(--accent); font-size:.85rem; padding:10px 16px; }
  .chnav a[hidden] { display:none; }

  /* 소리만 사용하는 유튜브 플레이어: 화면 밖에 둠 */
  #yt { position:absolute; left:-9999px; width:200px; height:200px; }

  /* 구절 시간 기록 도구 (주소 뒤에 ?record=1) */
  #rec { margin-top:12px; padding:10px; border:1px dashed var(--accent); border-radius:10px;
    font-family:system-ui,sans-serif; font-size:.85rem; }
  #rec button { padding:8px 14px; border-radius:8px; border:0; background:var(--accent);
    color:var(--bg); cursor:pointer; font-size:.9rem; margin-right:6px; }
  #rec button.sub { background:transparent; color:var(--fg); border:1px solid var(--line); }
  #rec textarea { width:100%; height:110px; margin-top:8px; background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; font-size:.8rem; }
</style>
</head>
<body>
<main>
  <header>
    <div class="date" id="date"></div>
    <h1 id="title"></h1>
  </header>

  <div class="player">
    <div class="row">
      <button id="prev" aria-label="이전 구절">&#9664;&#9664;</button>
      <button id="play" aria-label="재생">&#9654;</button>
      <button id="next" aria-label="다음 구절">&#9654;&#9654;</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
      <span id="time">0:00 / 0:00</span>
    </div>
    <div class="speed" id="speed"></div>
    <p class="note" id="note" hidden></p>
    <div id="rec" hidden></div>
  </div>

  <article id="text"></article>

  <section id="game" class="game">
    <p id="gameLock" class="lock">끝까지 들으시면 미니 게임이 열립니다.</p>
    <div id="gameBox" hidden>
      <h2>방주 동물 쌓기</h2>
      <p class="sub">홍수가 차오릅니다. 좌우로 움직이는 동물을 화면을 탭해서 멈추고, 아래 동물 위에 겹쳐 높이 쌓아 주세요. 어긋난 만큼은 잘려 나갑니다.</p>
      <canvas id="gameCanvas" tabindex="0" aria-label="방주 동물 쌓기 게임"></canvas>
      <div id="goBox" class="gobox" hidden>
        <div class="gotitle" id="goTitle"></div>
        <p class="godesc" id="goDesc"></p>
        <button class="go" id="goAgain">다시 도전</button>
      </div>
    </div>
  </section>

  <nav class="chnav" aria-label="장 이동">
    <a id="chPrev" aria-label="이전 장">&#9664;<span id="chPrevT"></span></a>
    <a id="chToday" hidden>오늘</a>
    <a id="chNext" aria-label="다음 장"><span id="chNextT"></span>&#9654;</a>
  </nav>
</main>

<div id="yt"></div>

<script>
// 장별 유튜브 영상 ID (소리만 사용). 장을 추가할 때 한 줄씩 넣으세요.
var VIDEOS = {
  1: 'fxXb5ubK3N8',
  2: 'ff-2m6X0y7w',
  3: '99TnAal46E0',
  4: 'ItLbaNuM_c0',
  5: '2CYLB4g8sfI',
  6: '1GO8Z55Smns',
  7: 'DxhkgIFXzkg',
  8: 'KHZMsuV-GNk',
  9: 'wYRZFlmv63c',
  10: 'RCexzbff_N8',
  11: 'mv37KOLRW94',
  12: 'gw7RGYJ3e5E',
  13: 'ppzxYySjD2M',
  14: 'aWweDA-7uac',
  15: 'N8zMGuUjSE0',
  16: 'khdQuf3ZmG8',
  17: 'aQGU9-nbFMk',
  18: 'fgT6EJm-2l8',
  19: 'UD7ELzI3Sn8',
  20: 'oX1nKv3hreU',
  21: 'wtio2sQlvZI',
  22: 'W6CJvvDEXuY',
  23: 'pnyMgDTydsc',
  24: 'rWoiOLEs808',
  25: 'JEQRIIJ4JtU',
  26: 'gsIqfyMacAo',
  27: 'bN9xh1gj6Iw',
  28: 'HWY_2JFFBt8',
  29: 'nwoOgrTjkGA',
  30: 'hjg0-Q7Hv00',
  31: '_ftnRDjFiRM'
};

(function () {
  var params = new URLSearchParams(location.search);
  var now = new Date();
  var day = parseInt(params.get('day'), 10) || now.getDate();
  if (day < 1 || day > 31) day = now.getDate();
  var nn = String(day).padStart(2, '0');
  var recordMode = params.get('record') === '1';

  document.getElementById('date').textContent =
    now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일';
  document.getElementById('title').textContent = '잠언 ' + day + '장';
  document.title = '오늘의 잠언 - 잠언 ' + day + '장';

  // ---- 장 이동 화살표 (기본은 오늘 날짜의 장) ----
  var today = now.getDate();
  function chHref(n) {
    var p = new URLSearchParams(location.search);
    if (n === today) p.delete('day'); else p.set('day', n);
    var q = p.toString();
    return location.pathname + (q ? '?' + q : '');
  }
  (function () {
    var prev = document.getElementById('chPrev'), next = document.getElementById('chNext');
    var tdy = document.getElementById('chToday');
    if (day > 1) {
      prev.href = chHref(day - 1);
      document.getElementById('chPrevT').textContent = ' ' + (day - 1) + '장';
    } else prev.classList.add('off');
    if (day < 31) {
      next.href = chHref(day + 1);
      document.getElementById('chNextT').textContent = (day + 1) + '장 ';
    } else next.classList.add('off');
    if (day !== today) {
      tdy.hidden = false;
      tdy.href = chHref(today);
      tdy.textContent = '오늘(' + today + '장)';
    }
  })();

  var box = document.getElementById('text');
  var note = document.getElementById('note');
  var playBtn = document.getElementById('play');
  var seek = document.getElementById('seek');
  var timeEl = document.getElementById('time');
  var speedWrap = document.getElementById('speed');
  function say(msg) { note.hidden = !msg; note.textContent = msg || ''; }

  var verses = [], els = [];
  var times = null;        // text/NN.time.txt 에서 읽은 정확한 구절 시작 시간(초)
  var est = null, estDur = 0;   // 파일이 없을 때 글자 수로 계산한 대략의 시간
  var curIdx = -1;
  var api = null, dragging = false;
  var rate = 1;
  try { rate = parseFloat(localStorage.getItem('rate')) || 1; } catch (e) {}

  // ---- 본문: text/NN.txt (한 줄에 한 구절, 앞에 절 번호) ----
  function parseText(raw) {
    var lines = raw.replace(/\r/g, '').split('\n')
      .map(function (l) { return l.trim(); }).filter(Boolean);
    var numbered = lines.some(function (l) { return /^\d+[\.\)]?\s*\S/.test(l); });
    if (!numbered) return lines;
    var out = [];
    lines.forEach(function (l) {
      var m = l.match(/^\d+[\.\)]?\s*(.*)$/);
      if (m && m[1]) out.push(m[1]);
      else if (out.length) out[out.length - 1] += ' ' + l;
    });
    return out;
  }

  // ---- 시간표: text/NN.time.txt (한 줄에 구절 시작 시간 하나. 예: 0:05 또는 5.2) ----
  function parseTimes(raw) {
    return raw.replace(/\r/g, '').split('\n').map(function (l) { return l.trim(); })
      .filter(Boolean).map(function (l) {
        var tok = l.split(/\s+/).pop();
        if (tok.indexOf(':') >= 0) {
          var p = tok.split(':');
          return parseFloat(p[0]) * 60 + parseFloat(p[1]);
        }
        return parseFloat(tok);
      }).filter(function (n) { return !isNaN(n); });
  }

  function render() {
    box.innerHTML = '';
    els = verses.map(function (v, i) {
      var p = document.createElement('p');
      p.className = 'verse';
      var s = document.createElement('sup');
      s.textContent = i + 1;
      p.appendChild(s);
      p.appendChild(document.createTextNode(v));
      p.onclick = function () {
        if (recordMode) return;
        var ts = getTimes();
        if (ts && api) { api.seekTo(ts[i]); api.play(); }
      };
      box.appendChild(p);
      return p;
    });
  }

  fetch('text/' + nn + '.txt', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      verses = parseText(t);
      if (!verses.length) throw new Error('empty');
      render();
      if (recordMode) setupRecorder();
    })
    .catch(function () {
      box.innerHTML = '<p class="note">text/' + nn + '.txt 파일을 불러오지 못했습니다. (파일이 없거나, 파일을 직접 열어서 본 경우입니다. 웹 주소로 접속해 주세요.)</p>';
    });

  fetch('text/' + nn + '.time.txt', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) { var a = parseTimes(t); if (a.length) times = a; })
    .catch(function () {});

  // 구절 시작 시간: 정확한 시간표가 있으면 그것, 없으면 글자 수 비율로 대략 계산
  function getTimes() {
    if (!verses.length) return null;
    if (times) {
      var t = times.slice();
      while (t.length < verses.length) t.push(t[t.length - 1] + 5);
      return t;
    }
    var d = api ? api.dur() : 0;
    if (d > 0) {
      if (!est || estDur !== d) {
        var w = verses.map(function (v) { return v.length + 8; });
        var tot = w.reduce(function (a, b) { return a + b; }, 0), acc = 0;
        est = w.map(function (x) { var s = acc / tot * d; acc += x; return s; });
        estDur = d;
      }
      return est;
    }
    return null;
  }

  // ---- 끝까지 들었는지 확인 (건너뛰기로는 열리지 않음) ----
  var listened = 0, lastCur = null, unlocked = false;
  var forceUnlock = params.get('unlock') === '1';   // 테스트용: ?unlock=1
  function trackListening() {
    if (!api || unlocked) return;
    var c = api.cur();
    if (api.isPlaying() && lastCur !== null) {
      var d = c - lastCur;
      if (d > 0 && d < 1.5 * rate + 0.5) listened += d;   // 정상 재생으로 흘러간 시간만 합산
    }
    lastCur = c;
  }
  function onEnded() {
    var d = api ? api.dur() : 0;
    if (d > 0 && listened >= d * 0.85) openGame();
    else say('영상을 건너뛰지 않고 처음부터 끝까지 들으셔야 미니 게임이 열립니다.');
  }
  if (forceUnlock) setTimeout(openGame, 800);

  // ---- 미니 게임: 방주 동물 쌓기 ----
  function openGame() {
    if (unlocked) return;
    unlocked = true;
    document.getElementById('gameLock').hidden = true;
    document.getElementById('gameBox').hidden = false;
    initGame();
    setTimeout(function () {
      document.getElementById('game').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 400);
  }

  function initGame() {
    var cv = document.getElementById('gameCanvas');
    var ctx = cv.getContext('2d');
    var CW = 360, CH = 520, H = 40;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = CW * dpr; cv.height = CH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var KINDS = [
      { c: '#b9825a', ear: 'round' },
      { c: '#f6f0f2', ear: 'long', inner: '#f6b8c4' },
      { c: '#f0a35a', ear: 'point' },
      { c: '#4a5568', ear: 'none', belly: '#ffffff', beak: '#f6b042' },
      { c: '#f7b3c0', ear: 'point', snout: '#f08fa3' },
      { c: '#ffd84d', ear: 'tuft', beak: '#f59e0b' }
    ];
    var PERFECT = ['완벽해요!', '예술이다!', '소름 돋았어요', '오차 없음!', '방주가 감동했어요'];
    var CUT = ['아야!', '엉덩이가 잘렸어요', '좁아요 좁아!', '다이어트 성공?', '살짝 아팠어요'];
    var RANKS = [
      [0, '아직 방주에 오르지도 못한 동물'],
      [3, '첫 발을 뗀 새내기 선원'],
      [6, '제법 안정적인 갑판장'],
      [10, '동물들이 믿고 따르는 선장'],
      [15, '노아도 놀란 쌓기 장인'],
      [20, '하늘에 닿은 전설의 동물원장']
    ];
    var best = 0;
    try { best = parseInt(localStorage.getItem('arkBest'), 10) || 0; } catch (e) {}

    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
    function rr(x, y, w, h, r) {
      var d = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + d, y);
      ctx.arcTo(x + w, y, x + w, y + h, d);
      ctx.arcTo(x + w, y + h, x, y + h, d);
      ctx.arcTo(x, y + h, x, y, d);
      ctx.arcTo(x, y, x + w, y, d);
      ctx.closePath();
    }
    function txt(s, x, y, size, fill) {
      ctx.font = '800 ' + size + 'px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = size / 4.5; ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.strokeText(s, x, y);
      ctx.fillStyle = fill || '#6b4f2a';
      ctx.fillText(s, x, y);
    }

    // 동물 한 마리(= 블록 한 층)
    function animal(x, y, w, h, kind, mood, look) {
      var K = KINDS[kind % KINDS.length], cx = x + w / 2, cy = y + h / 2;
      var ex = Math.min(w * 0.3, 44);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.fillStyle = K.c;
      var s, i;
      if (K.ear === 'round') {
        for (i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.arc(cx + i * ex, y + 2, 9, 0, 6.3); ctx.fill(); }
      } else if (K.ear === 'long') {
        for (i = -1; i <= 1; i += 2) {
          ctx.fillStyle = K.c; rr(cx + i * ex - 6, y - 24, 12, 30, 6); ctx.fill();
          ctx.fillStyle = K.inner; rr(cx + i * ex - 3, y - 19, 6, 20, 3); ctx.fill();
        }
      } else if (K.ear === 'point') {
        for (i = -1; i <= 1; i += 2) {
          ctx.beginPath(); ctx.moveTo(cx + i * ex - 10, y + 4); ctx.lineTo(cx + i * ex + i * 2, y - 12);
          ctx.lineTo(cx + i * ex + 10, y + 4); ctx.closePath(); ctx.fill();
        }
      } else if (K.ear === 'tuft') {
        ctx.beginPath(); ctx.moveTo(cx - 6, y + 2); ctx.lineTo(cx - 3, y - 12); ctx.lineTo(cx, y + 1);
        ctx.lineTo(cx + 4, y - 10); ctx.lineTo(cx + 7, y + 2); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = K.c; rr(x, y, w, h, 14); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(60,40,20,.28)'; ctx.stroke();
      if (K.belly) { ctx.fillStyle = K.belly; ctx.beginPath(); ctx.ellipse(cx, cy + 5, Math.min(w * 0.3, 30), h * 0.36, 0, 0, 6.3); ctx.fill(); }

      var sp = Math.max(6, Math.min(w * 0.22, 16)), ey = cy - 4;
      ctx.fillStyle = '#2b2723'; ctx.strokeStyle = '#2b2723'; ctx.lineWidth = 2.2;
      if (mood === 'happy') {
        for (i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.arc(cx + i * sp, ey + 3, 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else if (mood === 'ouch') {
        for (i = -1; i <= 1; i += 2) {
          ctx.beginPath(); ctx.moveTo(cx + i * sp - i * 4, ey - 4); ctx.lineTo(cx + i * sp + i * 3, ey); ctx.lineTo(cx + i * sp - i * 4, ey + 4); ctx.stroke();
        }
      } else {
        var lx = (look || 0) * 1.6;
        for (i = -1; i <= 1; i += 2) {
          ctx.fillStyle = '#2b2723'; ctx.beginPath(); ctx.arc(cx + i * sp + lx, ey, 3.5, 0, 6.3); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + i * sp + lx + 1, ey - 1.2, 1.1, 0, 6.3); ctx.fill();
        }
      }
      if (w >= 34) {
        ctx.fillStyle = 'rgba(255,110,130,.45)';
        for (i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.ellipse(cx + i * (sp + 9), ey + 8, 5, 3, 0, 0, 6.3); ctx.fill(); }
      }
      if (K.snout) {
        ctx.fillStyle = K.snout; ctx.beginPath(); ctx.ellipse(cx, ey + 9, 8, 5.5, 0, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#8a3f50';
        for (i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.arc(cx + i * 3, ey + 9, 1.3, 0, 6.3); ctx.fill(); }
      } else if (K.beak) {
        ctx.fillStyle = K.beak; ctx.beginPath(); ctx.moveTo(cx - 5, ey + 6); ctx.lineTo(cx + 5, ey + 6); ctx.lineTo(cx, ey + 13); ctx.closePath(); ctx.fill();
      } else if (mood === 'ouch') {
        ctx.fillStyle = '#7a2d2d'; ctx.beginPath(); ctx.ellipse(cx, ey + 11, 3.5, 4.5, 0, 0, 6.3); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(cx, ey + 6, 5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      }
      if (K.ear === 'point' && !K.snout && w >= 40) {
        ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(43,39,35,.6)';
        for (i = -1; i <= 1; i += 2) {
          ctx.beginPath(); ctx.moveTo(cx + i * 14, ey + 7); ctx.lineTo(cx + i * 26, ey + 4); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx + i * 14, ey + 10); ctx.lineTo(cx + i * 26, ey + 12); ctx.stroke();
        }
      }
    }

    var st, rain = [], clouds = [], last = 0;
    for (var r0 = 0; r0 < 45; r0++) rain.push({ x: Math.random() * CW, y: Math.random() * CH, v: 380 + Math.random() * 200 });
    for (var c0 = 0; c0 < 4; c0++) clouds.push({ x: Math.random() * CW, y: 30 + c0 * 55, s: 0.7 + Math.random() * 0.7, v: 6 + Math.random() * 8 });

    function reset() {
      st = { state: 'ready', blocks: [{ x: (CW - 200) / 2, w: 200, k: 0, mood: 'smile' }],
        mx: 0, mw: 200, mk: 1, dir: 1, moving: true, debris: [], cam: 440, run: 0,
        bubble: { text: '비가 와요! 빨리 쌓아요!', t: 0, dur: 3 }, shake: 0, time: 0 };
      document.getElementById('goBox').hidden = true;
    }
    function score() { return st.blocks.length - 1; }
    function say2(text, dur) { st.bubble = { text: text, t: 0, dur: dur || 1.1 }; }

    function place() {
      var top = st.blocks[st.blocks.length - 1], n = st.blocks.length, y = -(n + 1) * H;
      var L = Math.max(top.x, st.mx), R = Math.min(top.x + top.w, st.mx + st.mw), ov = R - L;
      if (ov <= 0) {
        st.debris.push({ x: st.mx, y: y, w: st.mw, k: st.mk, vx: st.dir * 70, vy: -140, r: 0, vr: st.dir * 2.2 });
        st.moving = false;
        return gameOver();
      }
      var nb;
      if (Math.abs(st.mx - top.x) < 5) {
        st.run++;
        var grow = (st.run >= 3 && top.w + 10 <= 220) ? 10 : 0;
        nb = { x: top.x - grow / 2, w: top.w + grow, k: st.mk, mood: 'happy' };
        say2(grow ? '몸집이 커졌어요!' : pick(PERFECT));
      } else {
        st.run = 0;
        if (st.mx < top.x) st.debris.push({ x: st.mx, y: y, w: top.x - st.mx, k: st.mk, vx: -60, vy: -90, r: 0, vr: -2.5 });
        else st.debris.push({ x: top.x + top.w, y: y, w: st.mx + st.mw - (top.x + top.w), k: st.mk, vx: 60, vy: -90, r: 0, vr: 2.5 });
        nb = { x: L, w: ov, k: st.mk, mood: 'ouch' };
        say2(pick(CUT));
      }
      st.blocks.push(nb);
      var sc = score();
      if (sc > 0 && sc % 5 === 0) say2(sc + '층! 어지러워요', 1.4);
      st.mw = nb.w; st.mk = (st.mk + 1) % KINDS.length;
      st.dir = -st.dir; st.mx = st.dir > 0 ? 0 : CW - st.mw;
    }

    function gameOver() {
      st.state = 'over'; st.shake = 0.4;
      var sc = score(), title = RANKS[0][1];
      RANKS.forEach(function (r) { if (sc >= r[0]) title = r[1]; });
      if (sc > best) { best = sc; try { localStorage.setItem('arkBest', best); } catch (e) {} }
      document.getElementById('goTitle').textContent = '칭호: ' + title;
      document.getElementById('goDesc').textContent = sc + '층을 쌓았습니다. (최고 기록 ' + best + '층) 동물들은 무사히 헤엄쳐 나왔습니다. 아마도요.';
      document.getElementById('goBox').hidden = false;
    }

    function tap() {
      if (st.state === 'ready') { st.state = 'play'; st.bubble = null; return; }
      if (st.state === 'play') place();
    }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
    cv.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); } });
    document.getElementById('goAgain').onclick = reset;

    function update(dt) {
      st.time += dt;
      if (st.state === 'play' && st.moving) {
        var spd = Math.min(130 + score() * 9, 340);
        st.mx += st.dir * spd * dt;
        if (st.mx < 0) { st.mx = 0; st.dir = 1; }
        if (st.mx > CW - st.mw) { st.mx = CW - st.mw; st.dir = -1; }
      }
      st.debris.forEach(function (d) { d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.r += d.vr * dt; });
      st.debris = st.debris.filter(function (d) { return d.y + st.cam < CH + 120; });
      var camT = Math.max(440, 220 + (st.blocks.length + 1) * H);
      st.cam += (camT - st.cam) * Math.min(1, dt * 5);
      if (st.bubble) { st.bubble.t += dt; if (st.bubble.t > st.bubble.dur) st.bubble = null; }
      if (st.shake > 0) st.shake = Math.max(0, st.shake - dt);
      rain.forEach(function (d) { d.y += d.v * dt; d.x -= 40 * dt; if (d.y > CH) { d.y = -10; d.x = Math.random() * CW + 30; } });
      clouds.forEach(function (c) { c.x += c.v * dt; if (c.x > CW + 80) c.x = -80; });
    }

    function draw() {
      var sc = score();
      var g = ctx.createLinearGradient(0, 0, 0, CH);
      g.addColorStop(0, '#9fcdf0'); g.addColorStop(1, '#e8f4fb');
      ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
      if (sc > 0) { ctx.fillStyle = 'rgba(255,214,120,' + Math.min(0.35, sc / 60) + ')'; ctx.fillRect(0, 0, CW, CH); }
      clouds.forEach(function (c) {
        var cy = c.y + (st.cam - 440) * 0.12;
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        [[0, 0, 26], [22, 6, 20], [-22, 8, 18], [8, -10, 18]].forEach(function (p) {
          ctx.beginPath(); ctx.arc(c.x + p[0] * c.s, cy + p[1] * c.s, p[2] * c.s, 0, 6.3); ctx.fill();
        });
      });

      ctx.save();
      var shx = st.shake > 0 ? (Math.random() - 0.5) * 10 * st.shake * 2.5 : 0;
      ctx.translate(shx, st.cam);
      // 방주 선체
      var ax = CW / 2;
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath(); ctx.moveTo(ax - 140, 0); ctx.lineTo(ax + 140, 0); ctx.lineTo(ax + 100, 40); ctx.lineTo(ax - 100, 40); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2;
      [12, 26].forEach(function (yy) { ctx.beginPath(); ctx.moveTo(ax - 130 + yy * 0.6, yy); ctx.lineTo(ax + 130 - yy * 0.6, yy); ctx.stroke(); });
      // 쌓인 동물들
      st.blocks.forEach(function (b, i) { animal(b.x, -(i + 1) * H, b.w, H, b.k, b.mood, 0); });
      if (st.moving && st.state !== 'over') animal(st.mx, -(st.blocks.length + 1) * H, st.mw, H, st.mk, 'smile', st.dir);
      st.debris.forEach(function (d) {
        ctx.save(); ctx.translate(d.x + d.w / 2, d.y + H / 2); ctx.rotate(d.r);
        animal(-d.w / 2, -H / 2, d.w, H, d.k, 'ouch', 0); ctx.restore();
      });
      // 말풍선
      if (st.bubble) {
        var b = st.bubble, a = Math.max(0, Math.min(1, (b.dur - b.t) / 0.3));
        ctx.globalAlpha = a;
        ctx.font = '700 14px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
        var tw = ctx.measureText(b.text).width + 22;
        var top = st.blocks[st.blocks.length - 1];
        var bcx = Math.max(tw / 2 + 6, Math.min(CW - tw / 2 - 6, top.x + top.w / 2));
        var by = -(st.blocks.length + 1) * H - 58;
        ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(60,40,20,.35)'; ctx.lineWidth = 1.5;
        rr(bcx - tw / 2, by, tw, 28, 13); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bcx - 5, by + 27); ctx.lineTo(bcx + 5, by + 27); ctx.lineTo(bcx, by + 35); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#2b2723'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.text, bcx, by + 14);
        ctx.globalAlpha = 1;
      }
      // 물
      var wy = 18;
      [['rgba(70,150,215,.80)', 3, 0], ['rgba(110,185,235,.55)', 2.2, 2]].forEach(function (w) {
        ctx.fillStyle = w[0]; ctx.beginPath(); ctx.moveTo(-10, CH + 400);
        for (var x = -10; x <= CW + 10; x += 8) ctx.lineTo(x, wy + w[2] + Math.sin((x + st.time * (w[2] ? -50 : 60)) / 18) * w[1] * 1.6);
        ctx.lineTo(CW + 10, CH + 400); ctx.closePath(); ctx.fill();
      });
      ctx.restore();

      // 빗줄기
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.4;
      rain.forEach(function (d) { ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 3, d.y + 11); ctx.stroke(); });

      txt(String(sc), CW / 2, 46, 40);
      if (best > 0) txt('최고 ' + best + '층', CW - 52, 22, 14, '#6b4f2a');
      if (st.state === 'ready') txt('탭해서 시작!', CW / 2, 150, 30);
      if (st.state === 'over') txt('풍덩!', CW / 2, 150, 46, '#2f6fb0');
    }

    function frame(ts) {
      var dt = Math.min((ts - last) / 1000, 0.05); last = ts || 0;
      update(dt); draw();
      requestAnimationFrame(frame);
    }
    reset();
    requestAnimationFrame(function (ts) { last = ts; requestAnimationFrame(frame); });
  }

  // ---- 재생 위치에 맞춰 하이라이트 이동 ----
  function mark(i, scroll) {
    if (i === curIdx) return;
    curIdx = i;
    els.forEach(function (e, k) { e.classList.toggle('on', k === i); });
    if (scroll && i >= 0 && els[i]) els[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function syncHighlight() {
    if (!api || recordMode) return;
    var ts = getTimes();
    if (!ts) return;
    var c = api.cur() + 0.15, idx = -1;
    for (var k = 0; k < ts.length; k++) { if (ts[k] <= c) idx = k; else break; }
    mark(idx, api.isPlaying());
  }

  // ---- 플레이어 UI ----
  function fmt(t) {
    t = Math.max(0, Math.floor(t || 0));
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }
  function refresh() {
    if (!api) return;
    var d = api.dur(), c = api.cur();
    if (!dragging && d > 0) seek.value = Math.round(c / d * 1000);
    timeEl.textContent = fmt(c) + ' / ' + fmt(d);
    playBtn.innerHTML = api.isPlaying() ? '&#10074;&#10074;' : '&#9654;';
    syncHighlight();
    trackListening();
  }
  setInterval(refresh, 200);

  playBtn.onclick = function () {
    if (!api) return;
    api.isPlaying() ? api.pause() : api.play();
    setTimeout(refresh, 100);
  };
  seek.addEventListener('input', function () { dragging = true; });
  seek.addEventListener('change', function () {
    dragging = false;
    if (api && api.dur() > 0) { api.seekTo(seek.value / 1000 * api.dur()); setTimeout(refresh, 100); }
  });
  function jump(delta) {
    var ts = getTimes();
    if (!ts || !api) return;
    var i = Math.min(ts.length - 1, Math.max(0, curIdx + delta));
    api.seekTo(ts[i]);
    setTimeout(refresh, 100);
  }
  document.getElementById('prev').onclick = function () { jump(-1); };
  document.getElementById('next').onclick = function () { jump(1); };

  var speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
  function setSpeed(r) {
    rate = r;
    if (api) api.setRate(r);
    Array.prototype.forEach.call(speedWrap.children, function (b) {
      b.classList.toggle('on', parseFloat(b.dataset.r) === r);
    });
    try { localStorage.setItem('rate', r); } catch (e) {}
  }
  speeds.forEach(function (r) {
    var b = document.createElement('button');
    b.textContent = r + 'x';
    b.dataset.r = r;
    b.onclick = function () { setSpeed(r); };
    speedWrap.appendChild(b);
  });
  setSpeed(rate);

  // ---- 유튜브 음성 (소리만 사용) ----
  var vid = VIDEOS[day];
  if (!vid) {
    say('잠언 ' + day + '장 음성이 아직 연결되지 않았습니다. (index.html 의 VIDEOS 에 영상 ID를 추가해 주세요)');
    playBtn.disabled = true;
  } else {
    window.onYouTubeIframeAPIReady = function () {
      var player = new YT.Player('yt', {
        width: '200', height: '200', videoId: vid,
        playerVars: { playsinline: 1, controls: 0, rel: 0, fs: 0, disablekb: 1, modestbranding: 1 },
        events: {
          onReady: function () {
            api = {
              play: function () { player.playVideo(); },
              pause: function () { player.pauseVideo(); },
              isPlaying: function () { return player.getPlayerState() === 1; },
              seekTo: function (t) { player.seekTo(t, true); },
              cur: function () { return player.getCurrentTime() || 0; },
              dur: function () { return player.getDuration() || 0; },
              setRate: function (r) { player.setPlaybackRate(r); }
            };
            setSpeed(rate);
            if (!times && !recordMode) say('구절 시간표(text/' + nn + '.time.txt)가 없어서 하이라이트가 대략적으로 움직입니다.');
          },
          onStateChange: function (e) {
            if (e.data === 1) player.setPlaybackRate(rate);
            if (e.data === 0) { trackListening(); onEnded(); }   // 재생 끝
          },
          onError: function () {
            say('이 영상은 외부 사이트에서 재생할 수 없도록 설정되어 있습니다. 영상 소유자에게 퍼가기 허용을 요청해 주세요.');
          }
        }
      });
    };
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }

  // ---- 구절 시간 기록 도구 ----
  function setupRecorder() {
    var rec = document.getElementById('rec');
    rec.hidden = false;
    rec.innerHTML =
      '<div id="recMsg"></div>' +
      '<div style="margin-top:8px"><button id="recMark">구절 시작</button>' +
      '<button class="sub" id="recUndo">되돌리기</button></div>' +
      '<textarea id="recOut" readonly></textarea>' +
      '<div style="margin-top:6px;color:var(--muted)">끝나면 위 내용을 복사해서 text/' + nn + '.time.txt 로 저장하세요.</div>';
    var got = [];
    var msg = document.getElementById('recMsg');
    var out = document.getElementById('recOut');
    function show() {
      msg.textContent = got.length < verses.length
        ? '영상을 재생하고, ' + (got.length + 1) + '절 읽기가 시작되는 순간 [구절 시작]을 누르세요. (' + got.length + '/' + verses.length + ')'
        : '모든 구절을 기록했습니다.';
      out.value = got.map(function (t) { return t.toFixed(1); }).join('\n');
      els.forEach(function (e, k) { e.classList.toggle('on', k === got.length); });
      if (els[got.length]) els[got.length].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    document.getElementById('recMark').onclick = function () {
      if (!api || got.length >= verses.length) return;
      got.push(api.cur());
      show();
    };
    document.getElementById('recUndo').onclick = function () { got.pop(); show(); };
    show();
  }

  window.addEventListener('pagehide', function () { if (api) api.pause(); });
})();
</script>
</body>
